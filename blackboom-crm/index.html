                        <div className="mt-4">
                            <div className="flex gap-2 mb-3">
                                <input value={discountCode} onChange={e => setDiscountCode(e.target.value)} placeholder="Have a discount code?" className="flex-1 p-3 bg-zinc-900 border border-zinc-800 rounded text-white outline-none" />
                                <button onClick={async () => {
                                    setError('');
                                    const resp = await validateDiscount(discountCode);
                                    if (!resp.ok) { setError(resp.error || 'Invalid code'); setDiscountApplied(null); } else { showToast('Discount applied', 'success'); }
                                }} disabled={discountApplying} className="px-4 py-3 bg-zinc-800 text-white rounded">{discountApplying ? 'Checking...' : 'Apply'}</button>
                            </div>
                            {discountApplied && (<div className="text-xs text-green-400 mb-3">Code applied: {discountApplied.code} — {discountApplied.type}</div>)}
                            <div className="flex gap-2 mt-2">
                                <button onClick={() => history.back()} className="flex-1 py-3 bg-zinc-800 text-white rounded">Back</button>
                                <button onClick={handleConfirm} disabled={loading} className="flex-1 py-3 bg-gold text-black rounded font-bold">{loading ? 'Processing...' : 'Confirm & Register'}</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- PRICING DETAILS ---
        function PricingDetails({ plan = 'basic', onBack }) {
            const features = {
                free: [ 'Limit 50 clients', 'Booking & reminders', 'Basic support' ],
                basic: [ 'Limit 500 clients', 'Booking & reminders', 'Client chat', 'Email reminders', 'Basic reports' ],
                pro: [ 'Unlimited clients', 'Client chat', 'Email marketing credits', 'Advanced reports', 'Priority support' ],
                mogul: [ 'All Pro features', 'Dedicated account manager', 'Custom integrations', 'White-glove onboarding' ]
            };
            const planTitles = { free: 'Free Starter', basic: 'Basic', pro: 'Pro', mogul: 'Mogul' };
            const planPrices = { free: 'Free', basic: '$5/mo', pro: '$15/mo', mogul: '$49/mo' };
            const allFeatures = Array.from(new Set([].concat(...Object.values(features))));

            return (
                <div className="min-h-screen py-12">
                    <div className="max-w-4xl mx-auto p-6 bg-black border border-zinc-800 rounded-lg">
                        <div className="flex items-start justify-between mb-6">
                            <div>
                                <h2 className="text-2xl font-bold">{planTitles[plan] || 'Plan Details'}</h2>
                                <div className="text-zinc-400 text-sm">{planPrices[plan] || ''}</div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={onBack} className="px-4 py-2 bg-zinc-800 text-white rounded">Back</button>
                                <a href={`#/plans`} className="px-4 py-2 bg-gold text-black rounded font-bold">Choose Plan</a>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <h3 className="text-lg font-bold mb-3">Features</h3>
                                <ul className="space-y-2">
                                    {allFeatures.map((f) => {
                                        const included = (features[plan] || []).includes(f);
                                        return (
                                            <li key={f} className={`flex items-start gap-3 text-sm ${included ? 'text-white' : 'text-zinc-500'}`}>
                                                <span className={`${included ? 'bg-gold text-black' : 'bg-zinc-800 text-zinc-500'} w-6 h-6 rounded flex items-center justify-center`}>{included ? '✓' : '—'}</span>
                                                <span>{f}</span>
                                            </li>
                                        );
                                    })}
                                </ul>
                            </div>
                            <div>
                                <h3 className="text-lg font-bold mb-3">Compare Plans</h3>
                                <div className="space-y-3">
                                    {['free','basic','pro','mogul'].map(p => (
                                        <div key={p} className="p-3 border border-zinc-800 rounded flex items-center justify-between">
                                            <div>
                                                <div className="font-bold">{planTitles[p]}</div>
                                                <div className="text-zinc-500 text-sm">{planPrices[p]}</div>
                                            </div>
                                            <a href={`#/pricing?plan=${p}`} className={`px-3 py-2 rounded ${p === plan ? 'bg-gold text-black font-bold' : 'bg-zinc-800 text-white'}`}>View</a>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- ROOT ---
        function Root() {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [showLanding, setShowLanding] = useState(true);
            const [initialMode, setInitialMode] = useState('barber'); // 'barber' or 'client'
            const [startRegister, setStartRegister] = useState(false); // when true, LoginScreen opens in Register mode
            const [route, setRoute] = useState(window.location.hash.startsWith('#/plans') ? 'plans' : (window.location.hash.startsWith('#/pricing') ? 'pricing' : ''));
            const [routeParams, setRouteParams] = useState(window.history.state?.signupData || null);

            useEffect(() => {
                const handleRoute = () => {
                    const h = window.location.hash || '';
                    if (h.startsWith('#/plans')) {
                        setRoute('plans');
                        setRouteParams(window.history.state?.signupData || null);
                    } else if (h.startsWith('#/pricing')) {
                        setRoute('pricing');
                        const qp = new URLSearchParams((h.split('?')[1]) || '');
                        setRouteParams({ plan: qp.get('plan') || 'basic' });
                    } else {
                        setRoute('');
                        setRouteParams(null);
                    }
                };
                window.addEventListener('hashchange', handleRoute);
                window.addEventListener('popstate', handleRoute);
                handleRoute();
                return () => { window.removeEventListener('hashchange', handleRoute); window.removeEventListener('popstate', handleRoute); };
            }, []);

            useEffect(() => { 
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => { 
                    console.log('onAuthStateChanged', { currentUserEmail: currentUser?.email, ADMIN_EMAIL });
                    setUser(currentUser); 
                    setAuthLoading(false); 
                    // If user is already logged in, skip landing page
                    if(currentUser) setShowLanding(false);
                }); 
                return () => unsubscribe(); 
            }, []);
            
            // Check for referral code in URL to skip landing page for invited clients
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('ref')) {
                    setShowLanding(false);
                }
            }, []);

            if (authLoading) return <div className="h-screen bg-black flex items-center justify-center"><Scissors className="text-gold w-8 h-8 animate-pulse" /></div>;

            // 1. If user is logged in, show the App
            if (user) {
                // Ensure email check is case-insensitive
                const isAdmin = !!(user.email && user.email.toLowerCase().trim() === ADMIN_EMAIL.toLowerCase().trim());
                console.log('Auth render check', { userEmail: user.email, ADMIN_EMAIL, isAdmin });
                if (isAdmin) return (<main id="main" role="main" className="container"><AdminDashboard adminUser={user} /><Toasts/><ConfirmModal/></main>);
                return (<main id="main" role="main" className="container"><RoleRouter user={user} /><Toasts/><ConfirmModal/></main>);
            }

            // 2. If not logged in and landing is active, show Landing
            if (showLanding) {
                return (<main id="main" role="main" className="container"><LandingPage onEnter={(mode) => { if (mode === 'barber_register') { setInitialMode('barber'); setStartRegister(true); } else { setInitialMode(mode); setStartRegister(false); } setShowLanding(false); }} /><Toasts/><ConfirmModal/></main>);
            }

            // 3a. If the free plans route is active, show full PlansPage
            if (!user && !showLanding && route === 'plans') {
                return (<main id="main" role="main" className="container"><PlansPage signupData={routeParams} onDone={() => { try { history.replaceState({}, '', '/'); } catch(e){ window.location.hash = ''; } }} /><Toasts/><ConfirmModal/></main>);
            }

            // 3b. Otherwise show Login/Register (and pass onBack handler)
            return (<main id="main" role="main" className="container"><LoginScreen initialMode={initialMode} startRegister={startRegister} onBack={() => { setShowLanding(true); setStartRegister(false); }} /><Toasts/><ConfirmModal/></main>);
        }

        function RoleRouter({ user }) {
            const [userData, setUserData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [profileError, setProfileError] = useState(null);
            const [showPlansModal, setShowPlansModal] = useState(false);

            function PaymentPending({ profile }) {
                return (
                    <div className="h-screen flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-lg p-6 text-center relative">
                            <button onClick={() => { try { setShowPlansModal(true); } catch(e) { try { window.history.back(); } catch(_){} } }} aria-label="Back" title="Back" className="absolute left-3 top-3 p-2 text-zinc-400 hover:text-white">
                                <ChevronLeft />
                            </button>
                            <h3 className="text-white font-bold text-lg mb-2">Payment Required</h3>
                            <p className="text-zinc-400 text-sm mb-4">We haven't received a confirmed payment for your selected plan yet. Once payment is confirmed your dashboard access will be enabled.</p>
                            <div className="text-left text-xs text-zinc-300 mb-3">
                                <div><strong>Plan:</strong> <span className="text-white">{profile.plan}</span></div>
                                {profile.trialStartDate && <div><strong>Trial:</strong> <span className="text-white">{profile.trialLengthDays} days</span></div>}
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => window.location.reload()} className="flex-1 py-3 bg-gold text-black rounded font-bold">Check Status</button>
                                <button onClick={() => { showToast('Contact support at support@blackbookcrm.org', 'info'); }} className="flex-1 py-3 bg-zinc-800 text-white rounded">Contact Support</button>
                            </div>
                            <p className="text-zinc-500 text-xs mt-3">If you completed payment recently, please allow a minute for processing and press "Check Status".</p>
                        </div>
                        {showPlansModal && (
                            <div className="fixed inset-0 z-60 flex items-start justify-center p-6">
                                <div className="w-full max-w-md">
                                    <PlansPage signupData={{}} onDone={() => { setShowPlansModal(false); }} />
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            useEffect(() => {
                const unsub = onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        setUserData(docSnap.data());
                        setLoading(false);
                    } else {
                        console.error("User profile document missing for UID:", user.uid);
                        setProfileError("Profile Not Found. Please contact support.");
                        setLoading(false);
                    }
                }, (err) => {
                    console.error("Error fetching user profile:", err);
                    setProfileError("Error loading profile. Check your connection.");
                    setLoading(false);
                });
                return () => unsub();
            }, [user]);

            if (loading) return <div className="h-screen bg-black flex flex-col items-center justify-center space-y-4"><Scissors className="text-gold w-8 h-8 animate-pulse" /><p className="text-zinc-500 text-xs uppercase tracking-widest animate-pulse">Setting up profile...</p></div>;
            
            if (profileError) return <div className="h-screen bg-black flex flex-col items-center justify-center text-red-500 p-6 text-center"><p className="font-bold mb-4">{profileError}</p><button onClick={() => signOut(auth)} className="underline text-zinc-400">Sign Out</button></div>;

            const fullUserProfile = { ...userData, uid: user.uid, email: user.email };
            // If barber and plan requires payment, ensure billingConfirmed is true before allowing dashboard access
            const paidPlans = ['basic', 'pro', 'mogul'];
            if (userData?.role === 'barber' && paidPlans.includes(userData.plan) && userData.billingConfirmed !== true && userData.plan !== 'free_trial') {
                return <PaymentPending profile={fullUserProfile} />;
            }
            if (userData?.role === 'client') return <ClientDashboard user={fullUserProfile} />;
            return <Dashboard user={fullUserProfile} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
        try { document.getElementById('app-loader')?.remove(); } catch(e){}
    </script>
</body>
</html>
