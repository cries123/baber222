        // --- Image resize helper: returns a Blob resized to maxDimension while preserving aspect ratio
        async function resizeImageFile(file, maxDimension = 1200, quality = 0.8) {
            if (!file || !(file instanceof File)) return file;
            try {
                const img = await new Promise((res, rej) => {
                    const i = new Image();
                    i.onload = () => res(i);
                    i.onerror = rej;
                    i.src = URL.createObjectURL(file);
                });
                const canvas = document.createElement('canvas');
                let { width, height } = img;
                if (width <= maxDimension && height <= maxDimension) {
                    URL.revokeObjectURL(img.src);
                    return file;
                }
                const ratio = width / height;
                if (ratio > 1) {
                    width = maxDimension; height = Math.round(maxDimension / ratio);
                } else {
                    height = maxDimension; width = Math.round(maxDimension * ratio);
                }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', quality));
                URL.revokeObjectURL(img.src);
                return blob instanceof Blob ? new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }) : file;
            } catch (e) {
                return file;
            }
        }

        // --- TOAST / NOTIFICATION BUS ---
        const toastBus = new EventTarget();
        function showToast(message, type = 'info', timeout = 4000) {
            toastBus.dispatchEvent(new CustomEvent('toast', { detail: { message, type, timeout } }));
        }

        function Toasts() {
            const [toasts, setToasts] = useState([]);
            useEffect(() => {
                const handler = (e) => {
                    const t = { id: Date.now() + Math.random(), ...e.detail };
                    setToasts((s) => [t, ...s]);
                    setTimeout(() => setToasts((s) => s.filter(x => x.id !== t.id)), e.detail.timeout || 4000);
                };
                toastBus.addEventListener('toast', handler);
                return () => toastBus.removeEventListener('toast', handler);
            }, []);

            return (
                <div aria-live="polite" className="fixed top-4 right-4 z-50 flex flex-col gap-2">
                    {toasts.map(t => (
                        <div key={t.id} className={`px-4 py-2 rounded shadow-lg max-w-xs ${t.type === 'error' ? 'bg-red-600' : t.type === 'success' ? 'bg-green-600' : 'bg-zinc-900'} text-white`}>{t.message}</div>
                    ))}
                </div>
            );
        }

        // --- CONFIRM / MODAL BUS ---
        const confirmBus = new EventTarget();
        function showConfirm({ title = 'Confirm', message = 'Are you sure?' } = {}) {
            return new Promise((resolve) => {
                confirmBus.dispatchEvent(new CustomEvent('confirm', { detail: { id: Date.now() + Math.random(), title, message, resolve } }));
            });
        }

        function ConfirmModal() {
            const [queue, setQueue] = useState([]);
            useEffect(() => {
                const handler = (e) => {
                    setQueue((q) => [e.detail, ...q]);
                };
                confirmBus.addEventListener('confirm', handler);
                return () => confirmBus.removeEventListener('confirm', handler);
            }, []);

            const cur = queue[0];
            if(!cur) return null;

            const respond = (val) => {
                try { cur.resolve(val); } catch(e){}
                setQueue((q) => q.filter(x => x.id !== cur.id));
            };

            return (

                // Convert "HH:MM" (24h) to 12-hour format with am/pm
                const formatHM = (hhmm) => {
                    if(!hhmm) return "";
                    const [hStr, mStr] = hhmm.split(':');
                    if(hStr === undefined || mStr === undefined) return hhmm;
                    let h = parseInt(hStr, 10);
                    const m = mStr.padStart(2, '0');
                    const ampm = h >= 12 ? 'PM' : 'AM';
                    h = h % 12;
                    if (h === 0) h = 12;
                    // Compact: no space to keep single-line in tight UI
                    return `${h}:${m}${ampm}`;
                }

                // Format minutes into human readable string like "1h 30m" or "45m"
                const formatDuration = (mins) => {
                    if (typeof mins !== 'number' || isNaN(mins) || mins <= 0) return '0m';
                    const h = Math.floor(mins / 60);
                    const m = mins % 60;
                    if (h > 0 && m > 0) return `${h}h ${m}m`;
                    if (h > 0) return `${h}h`;
                    return `${m}m`;
                }

                // --- PST helpers ---
                const getNowPST = () => {
                    const now = new Date();
                    const pstStr = now.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' });
                    return new Date(pstStr);
                };

                const parseDateTimePST = (dateStr, timeStr) => {
                    if(!dateStr) return null;
                    const t = timeStr || '00:00';
                    // Build local Date from PST-represented wall time
                    const localLike = new Date(`${dateStr}T${t}`);
                    const pstLike = new Date(localLike.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));
                    return pstLike;
                };

                const parseDatePST = (dateStr) => {
                    if(!dateStr) return null;
                    const localLike = new Date(`${dateStr}T00:00:00`);
                    return new Date(localLike.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' }));
                };

                };

        // --- CHAT WINDOW ---
        function ChatWindow({ currentUser, chatPartnerUid, chatPartnerName, onClose }) {
            const [chatPartnerPhoto, setChatPartnerPhoto] = useState(null);
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState("");
            const [isPartnerTyping, setIsPartnerTyping] = useState(false);
            const [attachments, setAttachments] = useState([]);
            const [sendOnEnter, setSendOnEnter] = useState(true);
            const [showEmoji, setShowEmoji] = useState(false);
            const bottomRef = useRef(null);
            const typingTimerRef = useRef(null);
            const conversationId = getConversationId(currentUser.uid, chatPartnerUid);

            // listen for messages (limited to recent for perf)
            useEffect(() => {
                const q = query(collection(db, "messages"), where("conversationId", "==", conversationId), orderBy('createdAt'));
                const unsubscribe = onSnapshot(q, async (snapshot) => {
                    const msgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    msgs.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                    setMessages(msgs);
                    setTimeout(() => bottomRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                    const unreadMsgs = snapshot.docs.filter(doc => doc.data().recipientId === currentUser.uid && !doc.data().read);
                    if (unreadMsgs.length > 0) { const batch = writeBatch(db); unreadMsgs.forEach(doc => batch.update(doc.ref, { read: true })); await batch.commit(); }
                });
                return () => unsubscribe();
            }, [conversationId, currentUser.uid]);

            // typing indicator listener
            useEffect(() => {
                const tRef = doc(db, 'typing', conversationId);
                const unsub = onSnapshot(tRef, (snap) => {
                    const d = snap.data();
                    if (!d) return setIsPartnerTyping(false);
                    const now = Date.now();
                    if (d.uid === chatPartnerUid && d.typing && (now - new Date(d.ts).getTime() < 5000)) setIsPartnerTyping(true);
                    else setIsPartnerTyping(false);
                });
                return () => unsub();
            }, [conversationId, chatPartnerUid]);

            // load chat partner profile (photo)
            useEffect(() => {
                if (!chatPartnerUid) return;
                try {
                    const unsub = onSnapshot(doc(db, 'users', chatPartnerUid), (snap) => { if (snap.exists()) setChatPartnerPhoto(snap.data().photoURL || null); else setChatPartnerPhoto(null); });
                    return () => unsub();
                } catch (e) { setChatPartnerPhoto(null); }
            }, [chatPartnerUid]);

            // outbox retry queue (attempt periodically)
            useEffect(() => {
                const tryFlush = async () => {
                    try {
                        const q = JSON.parse(localStorage.getItem('chatOutbox') || '[]');
                        if (!q || !q.length) return;
                        const remaining = [];
                        for (const item of q) {
                            try {
                                await addDoc(collection(db, 'messages'), item);
                            } catch (err) { remaining.push(item); }
                        }
                        localStorage.setItem('chatOutbox', JSON.stringify(remaining));
                    } catch (e) { console.error('flush outbox', e); }
                };
                const id = setInterval(tryFlush, 5000);
                tryFlush();
                return () => clearInterval(id);
            }, []);

            const setTyping = async (typing) => {
                const tRef = doc(db, 'typing', conversationId);
                try { await setDoc(tRef, { uid: currentUser.uid, typing, ts: new Date().toISOString(), conversationId }, { merge: true }); } catch (e) {}
            };

            const handleInputChange = (e) => {
                setNewMessage(e.target.value);
                if (typingTimerRef.current) clearTimeout(typingTimerRef.current);
                setTyping(true);
                typingTimerRef.current = setTimeout(() => setTyping(false), 1500);
            };

            const handleAttach = (files) => {
                const list = Array.from(files || []);
                list.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => { setAttachments(prev => [...prev, { name: file.name, type: file.type, dataUrl: ev.target.result }]); };
                    reader.readAsDataURL(file);
                });
            };

            const handleSend = async (e) => {
                if (e) e.preventDefault();
                const text = (newMessage || '').trim();
                if (!text && attachments.length === 0) return;
                const payload = { conversationId, senderId: currentUser.uid, recipientId: chatPartnerUid, text: text, read: false, delivered: false, createdAt: new Date().toISOString(), attachments: attachments.length ? attachments : undefined };
                try {
                    await addDoc(collection(db, 'messages'), payload);
                    setNewMessage(''); setAttachments([]); setShowEmoji(false);
                } catch (err) {
                    showToast('Message failed; queued for retry.', 'error');
                    const q = JSON.parse(localStorage.getItem('chatOutbox') || '[]'); q.push(payload); localStorage.setItem('chatOutbox', JSON.stringify(q));
                }
                setTyping(false);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey && sendOnEnter) { e.preventDefault(); handleSend(); }
            };

            const insertEmoji = (emoji) => { setNewMessage((s) => s + emoji); setShowEmoji(false); };

            return (
                <div className="absolute inset-0 bg-black z-50 flex flex-col fade-in">
                    <div className="p-4 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center"><div className="flex items-center gap-3"><button onClick={onClose} aria-label="Back" title="Back" className="text-zinc-400 p-2"><ChevronLeft /></button>{chatPartnerPhoto ? (<img src={chatPartnerPhoto} alt={chatPartnerName} className="w-8 h-8 rounded-full object-cover" />) : (<div className="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 font-bold">{(chatPartnerName||'').charAt(0) || 'P'}</div>)}<span className="text-white font-bold brand-font text-lg">{chatPartnerName}</span></div><div className="text-xs text-zinc-500">{isPartnerTyping ? 'typing...' : ''}</div></div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-black">
                        {messages.map((msg) => {
                            const isMe = msg.senderId === currentUser.uid;
                            return (
                                <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                    <div className={`max-w-[75%] p-3 rounded-xl text-sm ${isMe ? 'chat-bubble-me' : 'chat-bubble-them'}`}>
                                        {msg.replyTo && <div className="text-[11px] text-zinc-500 mb-1 italic">Replying…</div>}
                                        <div>{msg.text}</div>
                                        {msg.attachments && msg.attachments.map((a,i)=>(a.type && a.type.startsWith('image/') ? (<img key={i} src={a.dataUrl} alt={a.name} className="mt-2 rounded max-w-full" />) : (<a key={i} href={a.dataUrl} target="_blank" rel="noreferrer" className="mt-2 block text-xs text-zinc-300">{a.name}</a>)))}
                                    </div>
                                    <div className="flex items-center gap-2 mt-1 px-1 text-[9px] text-zinc-600">
                                        <span>{formatTime(msg.createdAt)}</span>
                                        {isMe && (<span>{msg.read ? <span className="text-green-400">✓✓</span> : (msg.delivered ? '✓' : '')}</span>)}
                                    </div>
                                </div>
                            );
                        })}
                        <div ref={bottomRef} />
                    </div>
                    <form onSubmit={handleSend} className="p-4 bg-zinc-900 border-t border-zinc-800">
                        <div className="flex items-start gap-2">
                            <div className="flex flex-col items-center gap-2">
                                <button type="button" onClick={() => setShowEmoji(s => !s)} className="p-2 bg-zinc-800 rounded text-zinc-400 hover:text-white" title="Emoji">😊</button>
                                <input type="file" onChange={(e)=>handleAttach(e.target.files)} className="hidden" id={`attach-${conversationId}`} />
                                <label htmlFor={`attach-${conversationId}`} className="p-2 bg-zinc-800 rounded text-zinc-400 hover:text-white cursor-pointer" title="Attach">📎</label>
                            </div>
                            <div className="flex-1">
                                {showEmoji && (<div className="bg-zinc-900 border border-zinc-800 p-2 rounded mb-2 grid grid-cols-8 gap-1">{['😄','😃','😊','😉','😍','👍','🔥','💯'].map(e => (<button key={e} type="button" onClick={()=>insertEmoji(e)} className="p-1">{e}</button>))}</div>)}
                                <textarea value={newMessage} onChange={handleInputChange} onKeyDown={handleKeyDown} placeholder="Type a message..." className="w-full resize-none bg-black border border-zinc-700 text-white rounded-xl px-4 py-3 outline-none focus:border-gold" rows={2}></textarea>
                                {attachments.length > 0 && (<div className="mt-2 flex gap-2">{attachments.map((a,i)=>(a.type && a.type.startsWith('image/') ? (<img key={i} src={a.dataUrl} className="w-16 h-16 object-cover rounded" />) : (<div key={i} className="px-2 py-1 bg-zinc-800 rounded text-xs">{a.name}</div>)))}</div>)}
                            </div>
                            <div className="flex flex-col items-center gap-2">
                                <button type="submit" aria-label="Send" title="Send" className="bg-gold text-black rounded-full w-12 h-12 flex items-center justify-center font-bold shadow-lg hover:scale-105 transition-transform"><Send className="w-5 h-5" /></button>
                                <label className="text-[10px] text-zinc-400"><input type="checkbox" checked={sendOnEnter} onChange={(e)=>setSendOnEnter(e.target.checked)} /> Enter</label>
                            </div>
                        </div>
                    </form>
                </div>
            );
        }

                    setEditLastName(userProfile.lastName || '');
                    setEditPhone(userProfile.phone || userProfile.phoneNumber || '');
                    const p = userProfile.preferences || {};
                    setNotifEmail(p.notifications?.email ?? true);
                    setNotifSMS(p.notifications?.sms ?? false);
                    setNotifPush(p.notifications?.push ?? true);
                    setReminderHours(p.reminderHours ?? 24);
                }
            }, [userProfile]);

            const saveClientSettings = async () => {
                try {
                    const upd = {
                        firstName: editFirstName || undefined,
                        lastName: editLastName || undefined,
                        phone: editPhone || undefined,
                        preferences: {
                            notifications: { email: !!notifEmail, sms: !!notifSMS, push: !!notifPush },
                            reminderHours: Number(reminderHours) || 24,
                        }
                    };
                    // remove undefined keys
                    Object.keys(upd).forEach(k => { if (upd[k] === undefined) delete upd[k]; });

                    // handle profile image upload
                    if (newProfileImageFile) {
                        try {
                            setNewProfileUploading(true);
                            const storage = getStorage();
                            const fileToUpload = await resizeImageFile(newProfileImageFile, 800, 0.85);
                            const key = `avatars/${user.uid}/${Date.now()}_${(fileToUpload.name || 'avatar').replace(/[^a-z0-9.\-]/gi, '_')}`;
                            const sRef = storageRef(storage, key);
                            const uploadTask = uploadBytesResumable(sRef, fileToUpload);
                            await new Promise((res, rej) => { uploadTask.on('state_changed', null, rej, res); });
                            const url = await getDownloadURL(sRef);
                            upd.photoURL = url;
                            upd.photoPath = key;
                        } catch (upErr) {
                            console.error('Profile image upload failed', upErr);
                            showToast('Image upload failed', 'error');
                        } finally { setNewProfileUploading(false); }
                    }

                    await updateDoc(doc(db, 'users', user.uid), { ...upd, updatedAt: new Date().toISOString() });

                    // if client is linked to a barber, update their clients record(s) so barber roster shows avatar
                    try {
                        if (userProfile && userProfile.linkedBarberId) {
                            const q = query(collection(db, 'clients'), where('userId', '==', userProfile.linkedBarberId), where('email', '==', user.email));
                            const snap = await getDocs(q);
                            for (const d of snap.docs) {
                                const data = {};
                                if (upd.photoURL) data.photoURL = upd.photoURL;
                                if (upd.photoPath) data.photoPath = upd.photoPath;
                                if (Object.keys(data).length) await updateDoc(doc(db, 'clients', d.id), data);
                            }
                        }
                    } catch(e) { console.warn('Failed to update clients collection with photo', e); }

                    showToast('Settings saved', 'success');
                    setShowUserSettings(false);
                    setNewProfileImageFile(null); setNewProfileImageUrl('');
                } catch (err) {
                    showToast(err.message || 'Failed saving', 'error');
                }
            };

            const saveFavorite = (name) => {
                if(!name || selectedServices.length === 0) { showToast('Add services first', 'error'); return; }
                const key = `bb_favs_${user.uid}`;
                const items = selectedServices.map(s => ({ id: s.id, note: s.note || '' }));
                const fav = { id: Date.now() + Math.random(), name, items };
                const next = [fav, ...favorites];
                setFavorites(next);
                try { localStorage.setItem(key, JSON.stringify(next)); showToast('Saved favorite', 'success'); } catch(e) { showToast('Failed saving', 'error'); }
            };

            // helpers for time math
            const hhmmToMins = (t) => { if(!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
            const minsToHHMM = (mins) => { const h = Math.floor(mins / 60).toString().padStart(2, '0'); const m = (mins % 60).toString().padStart(2, '0'); return `${h}:${m}`; };

            const quickAddFavorite = (fav) => {
                const items = fav.items.map(it => barberServices.find(s => s.id === it.id)).filter(Boolean).map(s => ({ ...s, note: (fav.items.find(i=>i.id===s.id)?.note) || '' }));
                setSelectedServices(items);
                showToast('Added favorite', 'success');
            };

            useEffect(() => {
                let unsubProducts = null;
                if(user.linkedBarberId) {
                    // Fetch Barber Profile
                    getDoc(doc(db, "users", user.linkedBarberId)).then(docSnap => {
                        if(docSnap.exists()) setBarberProfile(docSnap.data());
                    });
                    // Fetch Barber Services
                    const qServices = query(collection(db, "services"), where("userId", "==", user.linkedBarberId));
                    getDocs(qServices).then(snap => {
                        setBarberServices(snap.docs.map(d => ({id: d.id, ...d.data()})));
                    });
                    // Fetch Barber Coupons
                    const qCoupons = query(collection(db, "coupons"), where("userId", "==", user.linkedBarberId));
                    getDocs(qCoupons).then(snap => {
                        setBarberCoupons(snap.docs.map(d => d.data()));
                    });
                    // Fetch Shop Products
                    const qProducts = query(collection(db, "products"), where("userId", "==", user.linkedBarberId));
                    let unsubProducts = null;
                    unsubProducts = onSnapshot(qProducts, snap => setShopProducts(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    // cleanup will unsubscribe unsubProducts below
                }
                // Fetch My Appointments
                const qAppts = query(collection(db, "appointments"), where("userId", "==", user.linkedBarberId), where("clientName", "==", user.firstName)); 
                const unsub = onSnapshot(qAppts, (snap) => {
                    const appts = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    appts.sort((a,b) => {
                        const A = parseDateTimePST(a.date, a.time) || new Date(0);
                        const B = parseDateTimePST(b.date, b.time) || new Date(0);
                        return A - B;
                    });
                    setAppointments(appts);
                });
                return () => { try { unsub(); } catch(e){} try { unsubProducts && unsubProducts(); } catch(e) {} };
            }, [user]);

            // initialize shop edit fields when barberProfile loads
            useEffect(() => {
                if (barberProfile) {
                    setShopNameEdit(barberProfile.shopName || '');
                    setPickupInstructionsEdit(barberProfile.pickupInstructions || '');
                }
            }, [barberProfile]);

            // GENERATE TIME SLOTS (exclude already-taken slots)
            useEffect(() => {
                if (selectedDate && barberProfile) {
                    const { shopOpen, shopClose, slotDuration } = barberProfile;
                    const slots = [];
                        // Helper to convert "HH:MM" to minutes from midnight
                        const toMins = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
                        // Helper to convert minutes to "HH:MM"
                        const toTime = (mins) => {
                            const h = Math.floor(mins / 60).toString().padStart(2, '0');
                            const m = (mins % 60).toString().padStart(2, '0');
                            return `${h}:${m}`;
                        };

                        const granularity = barberProfile.slotGranularity || 5; // minutes between possible starts
                        let current = toMins(shopOpen || "09:00");
                        const end = toMins(shopClose || "17:00");

                        // generate candidate start times by granularity
                        while (current < end) {
                            slots.push(toTime(current));
                            current += granularity;
                        }

                    // Realtime listener: update available slots when appointments for that date change
                    const barberId = user.linkedBarberId;
                    const q = query(collection(db, "appointments"), where("userId", "==", barberId), where("date", "==", selectedDate));
                    const unsub = onSnapshot(q, (snap) => {
                        const buffer = barberProfile.breakMinutes || 5;
                        const selectedTotal = selectedServices && selectedServices.length > 0 ? selectedServices.reduce((sum, s) => sum + (s.duration || barberProfile.slotDuration || 60), 0) : (barberProfile.slotDuration || 60);

                        // build taken ranges from existing appointments (exclude cancelled)
                        const takenRanges = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(a => a && a.status !== 'cancelled' && a.time).map(a => {
                            const apptStart = toMins(a.time);
                            let apptDur = a.totalDuration || 0;
                            if (!apptDur && a.services && Array.isArray(a.services)) apptDur = a.services.reduce((sum, s) => sum + (s.duration || 0), 0);
                            if (!apptDur) apptDur = barberProfile.slotDuration || 60;
                            return { start: Math.max(0, apptStart - buffer), end: apptStart + apptDur + buffer, apptId: a.id };
                        });

                        // Build break ranges (lunch + any configured shopBreaks)
                        const lunchStartMins = barberProfile.lunchStart ? toMins(barberProfile.lunchStart) : null;
                        const lunchEndMins = barberProfile.lunchEnd ? toMins(barberProfile.lunchEnd) : null;
                        const breakRanges = [];
                        if (lunchStartMins !== null && lunchEndMins !== null) breakRanges.push({ start: lunchStartMins, end: lunchEndMins, reason: 'break', label: 'Lunch' });
                        const configuredBreaks = barberProfile.shopBreaks || [];
                        if (Array.isArray(configuredBreaks)) {
                            configuredBreaks.forEach(b => {
                                try {
                                    if (b && b.start && b.end) {
                                        const s = toMins(b.start); const e = toMins(b.end);
                                        if (!isNaN(s) && !isNaN(e)) breakRanges.push({ start: s, end: e, reason: 'break', label: b.label || '' });
                                    }
                                } catch(e) {}
                            });
                        }

                        // For each candidate slot compute a reason: 'available'|'conflict'|'break'|'too_late'
                        const reasons = {};
                        const candidates = slots.map(slot => {
                            const start = toMins(slot);
                            const endMin = start + selectedTotal;
                            let reason = 'available';
                            if (endMin > toMins(shopClose || "17:00")) {
                                reason = 'too_late';
                            }
                            // check breaks first
                            if (reason === 'available') {
                                for (const br of breakRanges) {
                                    if (start < br.end && endMin > br.start) { reason = 'break'; break; }
                                }
                            }
                            // then check appointment conflicts
                            if (reason === 'available') {
                                for (const r of takenRanges) {
                                    if (start < r.end && r.start < endMin) { reason = 'conflict'; break; }
                                }
                            }
                            reasons[slot] = reason;
                            return slot;
                        });

                        const available = candidates.filter(s => reasons[s] === 'available');
                        setCandidateSlots(candidates);
                        setSlotReasons(reasons);
                        setAvailableSlots(available);
                    }, (err) => {
                        setAvailableSlots(slots);
                        setCandidateSlots(slots);
                        setSlotReasons({});
                    });
                    return () => unsub();
                } else {
                    setAvailableSlots([]);
                    setCandidateSlots([]);
                    setSlotReasons({});
                }
            }, [selectedDate, barberProfile, user.linkedBarberId, selectedServices]);

            const applyCoupon = () => {
                if(!couponCode) return;
                const found = barberCoupons.find(c => c.code === couponCode.toUpperCase());
                if(found) {
                    setDiscountApplied(found);
                    showToast(`Coupon Applied: ${found.code}`, 'success');
                } else {
                    showToast("Invalid Coupon Code", 'error');
                    setDiscountApplied(null);
                }
            };

            const handleBook = async () => {
                if(selectedServices.length === 0 || !selectedDate || !selectedTime) { showToast("Please select all details.", 'error'); return; }

                const baseTotal = selectedServices.reduce((sum, s) => sum + (s.salePrice || s.price || 0), 0);
                let finalPrice = baseTotal;
                if (discountApplied) {
                    if (discountApplied.type === 'fixed') finalPrice -= discountApplied.value;
                    else if (discountApplied.type === 'percent') finalPrice -= (finalPrice * (discountApplied.value / 100));
                }
                const tipAmount = 0;
                finalPrice = Math.max(0, finalPrice + tipAmount);

                const totalDuration = selectedServices.reduce((sum, s) => sum + (s.duration || barberProfile?.slotDuration || 60), 0);
                const payload = {
                    userId: user.linkedBarberId,
                    clientName: user.firstName,
                    services: selectedServices.map(s => ({ id: s.id, name: s.name, price: s.price, salePrice: s.salePrice || null, note: s.note || '' })),
                    totalDuration,
                    price: finalPrice,
                    originalPrice: baseTotal,
                    tipPercent: 0,
                    tipAmount: tipAmount,
                    date: selectedDate,
                    time: selectedTime,
                    status: 'booked',
                    bookedByClient: true,
                    coupon: discountApplied ? discountApplied.code : null,
                };

                try {
                    // Prevent double-booking: check if another non-cancelled appt exists at this barber/date/time
                    const conflictQ = query(collection(db, "appointments"), where("userId", "==", user.linkedBarberId), where("date", "==", selectedDate), where("time", "==", selectedTime));
                    const conflictSnap = await getDocs(conflictQ);
                    const conflicts = conflictSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(a => a.status !== 'cancelled');
                    if (conflicts.length > 0) {
                        // If editing, allow if the only conflict is the appointment being edited
                        if (!(editingAppointmentId && conflicts.length === 1 && conflicts[0].id === editingAppointmentId)) {
                            showToast('Time slot already taken. Pick another slot.', 'error');
                            return;
                        }
                    }
                    if (editingAppointmentId) {
                        await updateDoc(doc(db, 'appointments', editingAppointmentId), { ...payload, updatedAt: new Date().toISOString(), lastModifiedBy: user.uid });
                        showToast('Appointment updated', 'success');
                        setEditingAppointmentId(null);
                    } else {
                        await addDoc(collection(db, "appointments"), { ...payload, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), lastModifiedBy: user.uid });
                        showToast("Appointment Requested!", 'success');
                    }
                    setSelectedServices([]); setSelectedDate(""); setSelectedTime(""); setCouponCode(""); setDiscountApplied(null); setActiveTab('history');
                } catch (err) {
                    showToast(err.message || 'Error', 'error');
                }
            };

            const nowPST = getNowPST();
            const upcomingAppts = appointments.filter(a => {
                if (a.status === 'cancelled') return false;
                const dt = parseDateTimePST(a.date, a.time);
                return dt && dt >= nowPST;
            });
            const pastAppts = appointments.filter(a => {
                if (a.status === 'cancelled') return false;
                const dt = parseDateTimePST(a.date, a.time);
                return dt && dt < nowPST;
            });

            // Helper to render price with potential discount
            const renderPrice = () => {
                if(!selectedServices || selectedServices.length === 0) return null;
                const baseTotal = selectedServices.reduce((sum, s) => sum + (s.salePrice || s.price || 0), 0);
                if(!discountApplied) return <span className="text-gold font-mono text-xl">${baseTotal.toFixed(2)}</span>;

                let final = baseTotal;
                if (discountApplied.type === 'fixed') final -= discountApplied.value;
                else final -= (final * (discountApplied.value / 100));

                return (
                    <div className="flex flex-col items-end">
                        <span className="text-zinc-500 line-through text-xs">${baseTotal.toFixed(2)}</span>
                        <span className="text-green-500 font-mono text-xl">${Math.max(0, final).toFixed(2)}</span>
                    </div>
                );
            };

            return (
                <div className="min-h-screen w-full max-w-md mx-auto bg-black border-x border-zinc-800 relative shadow-2xl flex flex-col overflow-hidden">
                    {isBillingExpired && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80">
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-lg text-center max-w-lg mx-4">
                                <h2 className="text-lg font-bold text-white mb-2">Subscription Required</h2>
                                <p className="text-zinc-400 mb-4">Your monthly payment is overdue. You must make a payment to access the dashboard.</p>
                                <div className="flex justify-center gap-3">
                                    <button onClick={() => { window.location.href = '/#/plans'; }} className="px-4 py-2 bg-gold text-black font-bold rounded">Make Payment</button>
                                    <button onClick={() => setShowSupport(true)} className="px-4 py-2 bg-zinc-800 text-white rounded">Contact Support</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="shrink-0 p-6 pb-4 border-b border-zinc-900 bg-gradient-to-r from-zinc-900/80 to-zinc-950/60 z-20">
                        <div className="flex items-center justify-between gap-4 flex-wrap">
                            <div className="flex items-center gap-4">
                                {userProfile?.photoURL ? (
                                    <img src={userProfile.photoURL} alt={userProfile.firstName || 'User'} onError={(e)=>{e.target.onerror=null; e.target.style.display='none';}} className="w-14 h-14 rounded-full object-cover" />
                                ) : (
                                    <div className="w-14 h-14 rounded-full bg-zinc-800 flex items-center justify-center text-white font-bold text-xl">{(userProfile && userProfile.firstName) ? userProfile.firstName.charAt(0) : 'U'}</div>
                                )}

                                {showPickupModal && lastPlacedOrder && (
                                    <div className="fixed inset-0 z-60 flex items-center justify-center p-6">
                                        <div className="absolute inset-0 bg-black/80" onClick={() => setShowPickupModal(false)} />
                                        <div className="relative z-70 bg-zinc-950 w-full max-w-md rounded-xl border border-zinc-800 p-6 shadow-2xl">
                                            <h3 className="text-white font-bold mb-2">Pickup Instructions</h3>
                                            <div className="text-zinc-400 mb-4">{lastPlacedOrder.pickupInstructions || 'No pickup instructions provided.'}</div>
                                            <div className="flex justify-end gap-2">
                                                <button onClick={() => { setShowPickupModal(false); setViewingOrder(lastPlacedOrder); }} className="px-3 py-2 bg-gold text-black rounded">View Order</button>
                                                <button onClick={() => setShowPickupModal(false)} className="px-3 py-2 bg-zinc-800 text-white rounded">Close</button>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {viewingOrder && (
                                    <div className="fixed inset-0 z-70 flex items-center justify-center p-6">

                                        <div className="relative z-80 bg-zinc-950 w-full max-w-md rounded-xl border border-zinc-800 p-6 shadow-2xl">
                                            <button onClick={() => setViewingOrder(null)} className="absolute top-3 right-3 z-80 bg-zinc-900 text-white p-2 rounded">Close</button>
                                            <h3 className="text-white font-bold mb-2">Order Details</h3>
                                            <div className="mb-3">
                                                <div className="text-zinc-400 text-sm">Order ID</div>
                                                <div className="text-white font-bold">{viewingOrder.id}</div>
                                            </div>
                                            <div className="mb-3">
                                                <div className="text-zinc-400 text-sm">Items</div>
                                                <div className="space-y-2">
                                                    {viewingOrder.items && viewingOrder.items.map((it,i) => (
                                                        <div key={i} className="flex justify-between items-center bg-black/20 p-2 rounded">
                                                            <div className="text-white">{it.name} <span className="text-zinc-500 text-xs">x{it.qty}</span></div>
                                                            <div className="text-gold">${(it.price * it.qty).toFixed(2)}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div>
                                                <div className="text-zinc-400 text-sm">Pickup Instructions</div>
                                                <div className="text-zinc-300">{viewingOrder.pickupInstructions || '—'}</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                <div>
                                    <p className="text-xs text-zinc-400 uppercase">Welcome back</p>
                                    <h1 className="text-lg font-bold text-white brand-font">{userProfile?.firstName || user.email?.split('@')[0] || 'Guest'}</h1>
                                    <div className="text-xs text-zinc-400">{userProfile?.email || user.email}</div>
                                    <div className="mt-3 flex gap-3">
                                        <button onClick={() => setActiveTab('book')} className="py-2 px-4 rounded-xl bg-gradient-to-r from-yellow-400 to-yellow-500 text-black font-bold shadow-md text-sm">Book Now</button>
                                        <button onClick={() => setShowSupport(true)} className="py-2 px-4 rounded-xl bg-zinc-800 text-white text-sm">Contact Support</button>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 flex-shrink-0">
                                <div className="text-right mr-2">
                                    <div className="text-xs text-zinc-400">Loyalty</div>
                                    <div className="text-white font-bold">{userProfile?.credits || 0} pts</div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setShowChat(true)} aria-label="Open chat" title="Open chat" className="px-3 py-2 bg-zinc-800 rounded text-zinc-200 hover:bg-zinc-700">Chat</button>
                                    <button onClick={() => setShowSupport(true)} aria-label="Open support" title="Open support" className="px-3 py-2 bg-zinc-800 rounded text-zinc-200 hover:bg-zinc-700">Help</button>
                                    <button onClick={() => setShowUserSettings(true)} aria-label="Settings" title="Settings" className="px-3 py-2 bg-zinc-800 rounded text-zinc-200 hover:bg-zinc-700">Settings</button>
                                    <button onClick={() => signOut(auth)} aria-label="Sign out" title="Sign out" className="px-3 py-2 bg-red-700 rounded text-white whitespace-nowrap">Sign out</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 overflow-y-auto px-5 pt-6 pb-6 no-scrollbar relative">
                        {/* Top quick actions and upcoming appointment summary */}
                        <div className="mb-4">
                            {/* quick actions moved into header */}

                            {upcomingAppts && upcomingAppts.length > 0 ? (
                                <div className="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-between">
                                    <div>
                                        <div className="text-xs text-zinc-400">Next Appointment</div>
                                        <div className="text-white font-bold">{upcomingAppts[0].date} • {upcomingAppts[0].time ? formatHM(upcomingAppts[0].time) : ''}</div>
                                        <div className="text-zinc-500 text-sm">{upcomingAppts[0].service || (upcomingAppts[0].services ? upcomingAppts[0].services.map(s=>s.name).join(', ') : '')}</div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-gold font-mono">${upcomingAppts[0].price || (upcomingAppts[0].services ? upcomingAppts[0].services.reduce((s,a)=>s+(a.salePrice||a.price||0),0) : 0)}</div>
                                        <div className="mt-2"><button onClick={() => { setViewingApptClient(upcomingAppts[0]); }} className="px-3 py-2 bg-gold text-black rounded font-bold">View</button></div>
                                    </div>
                                </div>
                            ) : (
                                <div className="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-500">No upcoming appointments — Book your next cut!</div>
                            )}
                        </div>

                        {activeTab === 'book' && (
                            <div className="fade-in space-y-6">
                                <div>
                                    <h2 className="text-white brand-font text-lg mb-3">1. Select Service</h2>
                                    <div className="space-y-3">
                                        <div className="flex gap-2 items-center mb-2">
                                            <div className="flex-1 flex gap-2 flex-wrap">
                                                {favorites.map(f => (
                                                    <button key={f.id} onClick={() => quickAddFavorite(f)} className="px-3 py-1 text-xs bg-zinc-800 text-white rounded-full">{f.name}</button>
                                                ))}
                                            </div>
                                            <button onClick={() => { const name = prompt('Name for favorite combo'); if(name) saveFavorite(name); }} className="px-3 py-1 bg-gold text-black rounded text-xs font-bold">Save</button>
                                        </div>

                                        <div className="grid grid-cols-1 gap-3">
                                            {barberServices.map(svc => {
                                                const selected = selectedServices.find(s => s.id === svc.id);

                                                return (
                                                    <div key={svc.id} onClick={() => {
                                                        setDiscountApplied(null); setCouponCode("");
                                                        if (selected) setSelectedServices(prev => prev.filter(x => x.id !== svc.id));
                                                        else setSelectedServices(prev => [...prev, { ...svc, note: '' }]);
                                                    }} className={`p-4 rounded-xl border cursor-pointer flex justify-between items-center gap-3 transition-shadow ${selected ? 'bg-zinc-900 border-gold shadow-lg' : 'bg-black border-zinc-800 hover:shadow-md'}`}>
                                                        <div className="flex items-center gap-3">

                                                            <div>
                                                                <div className="flex items-center gap-2">

                        return () => { try { unsubDiscounts(); } catch(e){} try { unsubLic(); } catch(e){} };
                    } catch(e) { console.warn('Failed to subscribe licenseKeys', e); return () => { try { unsubDiscounts(); } catch(e){} }; }
                } catch(e) { console.warn('Failed to subscribe discounts', e); }
            }, []);

            const fetchAdminLogs = async () => {
                setLoadingLogs(true);
                try {
                    const qLogs = query(collection(db, 'adminLogs'), orderBy('createdAt', 'desc'), limit(500));
                    const snap = await getDocs(qLogs);
                    setAdminLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                } catch (e) { console.error(e); }
                setLoadingLogs(false);
            };

            const exportLogsCSV = (logs) => {
                const rows = [['timestamp','actor','action','details']];
                logs.forEach(l => rows.push([l.createdAt || '', l.actor || '', l.action || '', (l.details && JSON.stringify(l.details)) || '']));
                const csv = rows.map(r => r.map(c => '"' + String(c || '').replace(/"/g,'""') + '"').join(',')).join('\n');
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `admin_logs_${Date.now()}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
            };

            // Admin helpers: user billing adjustments

            const grantDurationToUser = async (userId, days = 30, mode = 'extend') => {
                if (!userId) { showToast('No user selected', 'error'); return; }
                try {
                    const userRef = doc(db, 'users', userId);
                    const snap = await getDoc(userRef);
                    const now = new Date();
                    let newDue;
                    const dms = (parseInt(days) || 0) * 24 * 60 * 60 * 1000;
                    if (mode === 'extend' && snap.exists() && snap.data().billingNextDue) {
                        const cur = new Date(snap.data().billingNextDue);
                        newDue = new Date(Math.max(cur.getTime(), now.getTime()) + dms);
                    } else {
                        newDue = new Date(now.getTime() + dms);
                    }
                    await updateDoc(userRef, { billingNextDue: newDue.toISOString(), billingUpdatedAt: new Date().toISOString() });
                    showToast('Billing updated', 'success');
                } catch (e) { console.error(e); showToast('Failed updating billing', 'error'); }
            };

            const formatTimeLeft = (iso) => {
                if (!iso) return '—';
                try {
                    const due = new Date(iso);
                    const now = new Date();
                    const diff = due - now;
                    if (diff <= 0) return 'Due';
                    const days = Math.floor(diff / (24*60*60*1000));
                    const hours = Math.floor((diff % (24*60*60*1000)) / (60*60*1000));
                    const mins = Math.floor((diff % (60*60*1000)) / (60*1000));
                    const parts = [];
                    if (days > 0) parts.push(`${days}d`);
                    if (hours > 0) parts.push(`${hours}h`);
                    parts.push(`${mins}m`);
                    return parts.join(' ');
                } catch (e) { return '—'; }
            };

            // Fetch bookings/payments and compute analytics where possible
            useEffect(() => {
                const computeAnalytics = async () => {
                    try {
                        // Weekly signups from users' createdAt if present
                        if (users && users.length) {
                            const now = Date.now();
                            const weekMs = 7 * 24 * 60 * 60 * 1000;
                            const recent = users.filter(u => u.createdAt && (now - new Date(u.createdAt).getTime()) <= weekMs).length;
                            setWeeklySignups(recent);

                            // build signup series for last 7 days
                            const days = Array.from({length:7}, (_,i)=>{ const d = new Date(); d.setDate(d.getDate() - (6-i)); return d; });
                            const series = days.map(day => {
                                const start = new Date(day.getFullYear(), day.getMonth(), day.getDate()).getTime();
                                const end = start + 24*60*60*1000;
                                return users.filter(u => u.createdAt && (new Date(u.createdAt).getTime() >= start && new Date(u.createdAt).getTime() < end)).length;
                            });
                            setSignupSeries(series);
                        }

                        // Try to read bookings collection if present
                        try {
                            const snap = await getDocs(collection(db, 'bookings'));
                            const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            const now = Date.now();
                            const days30 = 30 * 24 * 60 * 60 * 1000;
                            const recent30 = all.filter(b => b.createdAt && (now - new Date(b.createdAt).getTime()) <= days30);
                            setBookingsCount30(recent30.length);
                            const amounts = recent30.map(r => Number(r.amount || r.price || 0)).filter(v => !isNaN(v));
                            const total = amounts.reduce((s,a) => s + a, 0);
                            setAvgBookingValue(amounts.length ? (total / amounts.length) : 0);
                        } catch(e){ console.debug('No bookings collection or fetch failed', e); }

                        // Try to read payments/transactions for revenue
                        try {
                            const snap = await getDocs(collection(db, 'payments'));
                            const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            const now = new Date();
                            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
                            const revenue = all.filter(p => p.createdAt && new Date(p.createdAt).getTime() >= monthStart).reduce((s,p) => s + Number(p.amount || 0), 0);
                            setMonthlyRevenue(revenue || 0);
                        } catch(e){ console.debug('No payments collection or fetch failed', e); }
                    } catch(e) { console.error('Analytics compute failed', e); }
                };
                computeAnalytics();
            }, [users]);

            const changeUserRole = async (uid, newRole) => {
                try { await updateDoc(doc(db, 'users', uid), { role: newRole }); setUsers(users.map(u => u.id === uid ? { ...u, role: newRole } : u)); showToast('Role updated', 'success'); }
                catch(e){ showToast('Failed to update role', 'error'); }
            };

            const assignTicketToAdmin = async (ticketId) => {
                try { await updateDoc(doc(db, 'tickets', ticketId), { assignedTo: adminUser.email }); setTickets(tickets.map(t => t.id === ticketId ? { ...t, assignedTo: adminUser.email } : t)); showToast('Assigned', 'success'); }
                catch(e){ showToast('Assign failed', 'error'); }
            };

            const replyWithCanned = async (ticket, template) => {
                if(!ticket) return;
                const newMsg = { sender: 'admin', text: template, time: new Date().toISOString() };
                const updated = [...(ticket.messages||[]), newMsg];
                try { await updateDoc(doc(db, 'tickets', ticket.id), { messages: updated, status: 'replied' }); showToast('Replied', 'success'); }
                catch(e){ showToast('Reply failed', 'error'); }
            };

            const filteredUsers = users.filter(u => 
                (view === 'barbers' ? u.role === 'barber' : u.role === 'client') &&
                (u.email?.toLowerCase().includes(searchTerm.toLowerCase()) || u.firstName?.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const barbersCount = users.filter(u => u.role === 'barber').length;
            const clientsCount = users.filter(u => u.role === 'client').length;
            const openTicketsCount = tickets.filter(t => t.status === 'open').length;

            const handleUpdateUser = async (e) => {
                e.preventDefault();
                try {
                    await updateDoc(doc(db, "users", editingUser.id), editingUser);

                // Optimistic update locally not needed as snapshot handles it

                            <button onClick={() => setView('clients')} className={`flex-1 py-2 rounded text-xs font-bold uppercase ${view === 'clients' ? 'bg-gold text-black' : 'bg-zinc-900 text-zinc-500'}`}>Clients</button>
                            <button onClick={() => setView('support')} className={`flex-1 py-2 rounded text-xs font-bold uppercase ${view === 'support' ? 'bg-gold text-black' : 'bg-zinc-900 text-zinc-500'}`}>Support ({openTicketsCount})</button>
                            <button onClick={() => setView('discounts')} className={`flex-1 py-2 rounded text-xs font-bold uppercase ${view === 'discounts' ? 'bg-gold text-black' : 'bg-zinc-900 text-zinc-500'}`}>Discounts</button>
                        </div>
                    </div>

                    {view !== 'support' && (
                        <>
                            <div className="p-4"><input type="text" placeholder="Search users..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full bg-zinc-900 border border-zinc-800 p-3 rounded text-white text-sm outline-none focus:border-gold" /></div>
                            <div className="flex-1 overflow-y-auto p-4 grid gap-4 grid-cols-1 md:grid-cols-2">
                                {loading && <p className="text-zinc-500 text-center">Loading...</p>}
                                {filteredUsers.map(u => (
                                    <div key={u.id} className="bg-zinc-900 p-4 rounded-lg border border-zinc-800 flex flex-col justify-between transform transition-transform hover:-translate-y-1 hover:shadow-lg">
                                        <div>
                                            <div className="flex items-center gap-3">
                                                {u.photoURL ? (
                                                    <img src={u.photoURL} alt={u.firstName || 'User'} onError={(e)=>{e.target.onerror=null; e.target.style.display='none';}} className="w-12 h-12 rounded-full object-cover" />
                                                ) : (
                                                    <div className="w-12 h-12 rounded-full bg-zinc-800 flex items-center justify-center text-white font-bold text-lg">{u.firstName ? u.firstName.charAt(0) : 'U'}</div>
                                                )}
                                                <div>
                                                    <h3 className="text-white font-bold">{u.firstName || "No Name"}</h3>
                                                    <p className="text-xs text-zinc-500">{u.email}</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-2 mt-3">
                                                <span className="text-[9px] bg-zinc-800 px-2 py-0.5 rounded text-gold uppercase">{u.plan || "Free"}</span>
                                                {u.role === 'barber' && <span className="text-[9px] bg-zinc-800 px-2 py-0.5 rounded text-zinc-400">Credits: {u.credits || 0}</span>}
                                                <div className="ml-2 text-[11px] text-zinc-400">Next charge: <span className="text-white font-mono">{formatTimeLeft(u.billingNextDue)}</span></div>
                                            </div>
                                        </div>
                                        <div className="mt-4 flex items-center justify-end gap-2">
                                            <button onClick={() => setSelectedUser(u)} className="p-2 bg-zinc-800 rounded text-zinc-400 hover:text-white" title="Ghost Mode"><Eye className="w-4 h-4"/></button>
                                            <button onClick={() => setEditingUser(u)} className="p-2 bg-gold rounded text-black hover:opacity-90" title="Edit User"><EditIcon/></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}

                    {view === 'discounts' && (
                        <div className="p-4">
                            <h3 className="text-white font-bold mb-3">Discount Codes</h3>
                            <div className="bg-zinc-900 p-4 rounded-lg border border-zinc-800 mb-4">
                                <div className="grid grid-cols-3 gap-2">
                                    <input placeholder="Code (e.g. FREEPRO)" value={newDiscount.code} onChange={e=>setNewDiscount(s=>({...s, code: e.target.value}))} className="p-2 bg-black border border-zinc-800 rounded text-white" />
                                    <select value={newDiscount.type} onChange={e=>setNewDiscount(s=>({...s, type: e.target.value}))} className="p-2 bg-black border border-zinc-800 rounded text-white">
                                        <option value="free">Free</option>
                                        <option value="fixed">Fixed ($)</option>
                                        <option value="percent">Percent (%)</option>
                                    </select>
                                    <input placeholder="Value (0)" value={newDiscount.value} onChange={e=>setNewDiscount(s=>({...s, value: e.target.value}))} className="p-2 bg-black border border-zinc-800 rounded text-white" />
                                </div>
                                <div className="mt-2 grid grid-cols-2 gap-2">
                                    <input placeholder="Plan ID (optional)" value={newDiscount.planId} onChange={e=>setNewDiscount(s=>({...s, planId: e.target.value}))} className="p-2 bg-black border border-zinc-800 rounded text-white" />
                                    <div className="flex gap-2">
                                        <button onClick={createDiscount} className="px-4 py-2 bg-gold text-black rounded">Create</button>
                                        <button onClick={() => setNewDiscount({ code: '', type: 'free', value: 0, planId: '' })} className="px-4 py-2 bg-zinc-800 text-white rounded">Clear</button>
                                    </div>
                                </div>
                            </div>

                            <div className="space-y-3">
                                {discountsLoading && <div className="text-zinc-500">Loading codes...</div>}
                                {(!discountsLoading && discounts.length === 0) && <div className="text-zinc-500">No discount codes found.</div>}
                                {discounts.map(d => (
                                    <div key={d.id} className="bg-zinc-900 p-3 rounded border border-zinc-800 flex items-center justify-between">
                                        <div>
                                            <div className="font-bold text-white">{d.code} {d.planId ? <span className="text-xs text-zinc-400 ml-2">({d.planId})</span> : null}</div>
                                            <div className="text-xs text-zinc-400">Type: {d.type} {d.type === 'fixed' ? `- $${d.value}` : d.type === 'percent' ? `- ${d.value}%` : ''} • Created: {d.createdAt ? new Date(d.createdAt).toLocaleString() : ''}</div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => toggleDiscountActive(d.id, d.active)} className={`px-3 py-1 rounded ${d.active ? 'bg-green-600 text-black' : 'bg-zinc-800 text-white'}`}>{d.active ? 'Active' : 'Inactive'}</button>
                                            <button onClick={() => deleteDiscount(d.id)} className="px-3 py-1 rounded bg-red-700 text-white">Delete</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Admin modals and panels */}
                    {showActivity && (
                        <div className="absolute inset-0 z-50 bg-black/90 flex flex-col p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-white font-bold">Activity Log</h3>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => { fetchAdminLogs(); }} className="px-3 py-1 bg-zinc-800 rounded text-xs">Refresh</button>
                                    <button onClick={() => exportLogsCSV(adminLogs)} className="px-3 py-1 bg-gold rounded text-xs">Export CSV</button>
                                    <button onClick={() => setShowActivity(false)} className="px-3 py-1 bg-zinc-700 rounded text-xs">Close</button>
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto space-y-2">
                                {loadingLogs && <div className="text-zinc-500">Loading...</div>}
                                {!loadingLogs && adminLogs.length === 0 && <div className="text-zinc-500">No logs found. Click Refresh.</div>}
                                {adminLogs.map(l => (
                                    <div key={l.id} className="bg-zinc-900 p-3 rounded border border-zinc-800">
                                        <div className="flex justify-between text-xs text-zinc-400"><div>{l.actor || 'system'}</div><div>{l.createdAt ? new Date(l.createdAt).toLocaleString() : ''}</div></div>
                                        <div className="text-sm text-white font-bold mt-1">{l.action}</div>
                                        <div className="text-xs text-zinc-500 mt-1">{l.details ? JSON.stringify(l.details) : ''}</div>

                    {showRolesPanel && (

                                            </select>
                                        </div>
                                    </div>
                                ))}
                            </div>

                    {showAnalytics && (

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
